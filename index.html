<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waar is Paul</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1d2a;
      color: #eef4f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 1rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.6rem;
    }
    header p {
      margin: 0;
      color: #9db3c2;
      font-size: 0.95rem;
    }
    .map-wrap {
      flex: 1;
      padding: 0 1rem 1rem;
    }
    .map-frame {
      width: 100%;
      height: 100%;
      min-height: 60vh;
      border-radius: 10px;
      overflow: hidden;
      background: #10293b;
    }
    .route-wrap {
      padding: 0 1rem 1rem;
    }
    .route-wrap h2 {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .route-frame {
      width: 100%;
      height: 40vh;
      border-radius: 10px;
      overflow: hidden;
      background: #10293b;
    }
    .route-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6f8697;
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem;
    }
    footer {
      text-align: center;
      padding: 0.75rem 1rem 1.5rem;
      font-size: 0.85rem;
      color: #6f8697;
    }
    footer a {
      color: #9db3c2;
    }
    #play-music {
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid #3a5266;
      background: #16324a;
      color: #eef4f8;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #play-music:hover {
      background: #1c3d59;
    }
    #play-music.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚓ Waar is Paul</h1>
    <p>Roepnaam PA5475</p>
    <button id="play-music" class="hidden" type="button">🎵 Speel het lied</button>
  </header>

  <audio id="theme-song" src="paul-position.mp3" loop></audio>
  <script>
    const audio = document.getElementById('theme-song');
    const playButton = document.getElementById('play-music');
    audio.play().catch(() => {
      playButton.classList.remove('hidden');
    });
    playButton.addEventListener('click', () => {
      audio.play();
      playButton.classList.add('hidden');
    });
  </script>

  <div class="map-wrap">
    <div class="map-frame" id="vesselmap">
      <script type="text/javascript">
        var width = "100%";
        var height = "100%";
        var mmsi = "244790911";
        var show_track = true;
        var fleet = "";
      </script>
      <script type="text/javascript" src="https://www.vesselfinder.com/aismap.js"></script>
    </div>
  </div>

  <div class="route-wrap">
    <h2>MarineTraffic</h2>
    <div class="route-frame" id="marinetraffic-map">
      <iframe
        title="MarineTraffic kaart"
        width="100%"
        height="100%"
        frameborder="0"
        style="border: 0"
        src="https://www.marinetraffic.com/en/ais/embed/zoom:10/centery:52.0/centerx:5.0/maptype:0/shownames:false/mmsi:244790911/shipid:0/fleet:/fleet_id:/vtypes:/showmenu:true"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <div class="route-wrap">
    <h2>Route (log)</h2>
    <div class="route-frame" id="route-map">
      <div class="route-empty" id="route-empty">Route wordt geladen&hellip;</div>
    </div>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    async function loadRoute() {
      const emptyEl = document.getElementById('route-empty');
      let points = [];
      try {
        const res = await fetch('data/track-log.jsonl', { cache: 'no-store' });
        if (!res.ok) throw new Error('kon logbestand niet laden');
        const text = await res.text();
        points = text
          .split('\n')
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => JSON.parse(line))
          .filter((entry) => typeof entry.lat === 'number' && typeof entry.lon === 'number');
      } catch (err) {
        emptyEl.textContent = 'Route kon niet worden geladen.';
        return;
      }

      if (points.length === 0) {
        emptyEl.textContent = 'Nog geen gelogde posities.';
        return;
      }

      emptyEl.remove();
      const latLngs = points.map((p) => [p.lat, p.lon]);
      const map = L.map('route-map');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      const line = L.polyline(latLngs, { color: '#4fa3d1', weight: 3 }).addTo(map);
      L.circleMarker(latLngs[0], { radius: 5, color: '#6fbf73' }).addTo(map).bindTooltip('Start');
      L.circleMarker(latLngs[latLngs.length - 1], { radius: 5, color: '#e8a24a' })
        .addTo(map)
        .bindTooltip('Laatste positie');
      map.fitBounds(line.getBounds(), { padding: [20, 20] });
    }

    loadRoute();
  </script>

  <footer>
    Live positie via <a href="https://www.vesselfinder.com/" target="_blank" rel="noopener">VesselFinder</a>
    &amp; <a href="https://www.marinetraffic.com/" target="_blank" rel="noopener">MarineTraffic</a>
    &middot; positie werkt alleen als de boot AIS aan boord heeft en binnen bereik van een ontvanger is
  </footer>
</body>
</html>
